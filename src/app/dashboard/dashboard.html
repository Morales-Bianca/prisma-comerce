<div class="kiosk">
  <div class="kiosk-panel">
    <a class="login-corner" [routerLink]="['/', 'login']">👤</a>

    <h1>PRISMA COMERCE</h1>
    <p class="subtitle">Bienvenido — selecciona un módulo</p>

    <div class="modulos-wrap">

     <button class="arrow" (click)="mover(-1)">‹</button>

      <div class="modulos-row" #fila>
         @for (item of accesos(); track item.title) {
          <a class="modulo" [class.highlight]="item.highlight" [routerLink]="['/', item.path]">
            <span class="modulo-icon" [class.highlight]="item.highlight">{{ item.icon }}</span>
            <span class="modulo-title">{{ item.title }}</span>
          </a>
        }
      </div>

      <button class="arrow" (click)="mover(1)">›</button>
    </div>
  </div>
</div>
